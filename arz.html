<main>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="مهمة"><button id="pending-tab" role="tab" aria-selected="true"><span data-i18n="pending">لسه</span><span id="pending-count" class="tab-count">0</span></button><button id="done-tab" role="tab" aria-selected="false"><span data-i18n="done">خلصت</span><span id="done-count" class="tab-count">0</span></button></div><button id="example">مثال</button></div>

  <button id="export" class="icon-button" aria-label="نزّل المهام"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></button>

<footer><span id="save-status" role="status"></span></footer>
